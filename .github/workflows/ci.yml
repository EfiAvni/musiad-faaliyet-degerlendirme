name: CI

# Derleme, tip kontrolü ve testler şu ana kadar yalnızca elle çalıştırılıyordu.
# Bu iş akışı main'e giden her değişikliği aynı üç kontrolden geçirir.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Aynı dal için arka arkaya gelen push'larda eski koşuyu iptal et.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Arayüz — tip kontrolü ve derleme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Tip kontrolü
        run: npx tsc --noEmit

      - name: Derleme
        run: npm run build

  backend:
    name: Sunucu — testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Testler bellek içi SQLite kullanır (phpunit.xml), MySQL servisi gerekmez.
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, bcmath
          coverage: none

      - name: Composer önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      # composer install sonunda package:discover çalışır; .env'i ondan önce
      # oluşturuyoruz ki uygulama önyüklemesi eksik ortamla karşılaşmasın.
      - name: Ortam dosyası
        working-directory: backend
        run: cp .env.example .env

      - name: Bağımlılıklar
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Uygulama anahtarı
        working-directory: backend
        run: php artisan key:generate

      - name: Testler
        working-directory: backend
        run: php artisan test

  # Testler bellek içi SQLite'ta koşar; üretim MySQL kullanacak. Bu iş aynı
  # takımı gerçek MySQL 8'e karşı çalıştırır - ONLY_FULL_GROUP_BY, yabancı
  # anahtar sırası, sütun yeniden adlandırma gibi SQLite'ın affettiği ama
  # MySQL'in affetmediği farklar burada yakalanır.
  backend-mysql:
    name: Sunucu — MySQL uyumluluğu
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: musiad_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: musiad_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, zip, bcmath
          coverage: none

      - name: Composer önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Ortam dosyası
        working-directory: backend
        run: cp .env.example .env

      - name: Bağımlılıklar
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Uygulama anahtarı
        working-directory: backend
        run: php artisan key:generate

      # Migration'ları ayrı adımda koşuyoruz: testler de migrate ediyor ama
      # şema hatası orada onlarca test hatası olarak görünür, burada tek ve
      # okunur bir hata olarak çıkar. Seeder de MySQL'de sınanmış olur.
      - name: Migration ve seeder
        working-directory: backend
        run: php artisan migrate:fresh --seed --force

      - name: Testler
        working-directory: backend
        run: php artisan test

  # Bağımlılıklardaki bilinen açıklar. Denetim üretime çıkan paketlerde
  # engelleyicidir; yalnızca geliştirmede kullanılan paketlerde bilgi amaçlıdır,
  # çünkü onlar kullanıcının tarayıcısına ya da sunucuya hiç ulaşmaz.
  #
  # Kapsam dışı: public/vendor altındaki dosyalar paket yöneticisinden gelmediği
  # için bu denetimlere girmez, sürümleri elle takip edilir (docs/kurulum.md).
  guvenlik-denetimi:
    name: Bağımlılıklar — güvenlik denetimi
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Composer önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      # --locked şart: paketler kurulu değilken düz "composer audit" hiçbir şey
      # denetlemeden başarıyla çıkar ve CI sahte yeşil verir.
      - name: Sunucu bağımlılıkları
        working-directory: backend
        run: composer audit --locked --no-interaction

      - name: Arayüz bağımlılıkları (üretim)
        run: npm audit --omit=dev --audit-level=high

      # Geliştirme araçlarındaki açıklar derlemeyi durdurmaz ama görünür kalır.
      - name: Arayüz bağımlılıkları (geliştirme, bilgi amaçlı)
        continue-on-error: true
        run: npm audit --audit-level=high
